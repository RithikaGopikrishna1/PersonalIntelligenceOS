name: Refresh feeds and publish dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 7,18 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Refresh RSS feeds
        shell: bash
        run: |
          set -euo pipefail
          if [ -f scripts/update.py ]; then
            python scripts/update.py
          elif [ -f update.py ]; then
            # update.py expects to be in scripts/ so it writes data.json
            # into the repository rather than its parent directory.
            mkdir -p scripts
            cp update.py scripts/update.py
            python scripts/update.py
          else
            echo 'ERROR: RSS updater not found' >&2
            exit 1
          fi

      - name: Verify news data before publishing
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('data.json')
          if not p.exists():
              raise SystemExit('ERROR: data.json is missing from the repository root')
          data = json.loads(p.read_text(encoding='utf-8'))
          stories = data.get('articles', [])
          updated = data.get('updatedAt')
          print(f'Publishing {len(stories)} stories; updatedAt={updated}')
          if not stories or not updated:
              raise SystemExit('ERROR: data.json is empty or outdated; refusing to publish')
          PY

      - name: Prepare AI daily briefs (optional)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python ai_summarize.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
          name: github-pages

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
