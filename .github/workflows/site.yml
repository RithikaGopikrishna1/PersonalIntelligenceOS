name: Refresh feeds and publish dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 7,18 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Refresh RSS feeds
        run: |
          if [ -f scripts/update.py ]; then
            python scripts/update.py
          elif [ -f update.py ]; then
            python update.py
          else
            echo 'ERROR: RSS updater not found' >&2
            exit 1
          fi

      - name: Prepare AI daily briefs (optional)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python ai_summarize.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
          name: github-pages

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
