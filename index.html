<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="THE EDIT: five important stories per topic, in one beautifully concise screen.">
  <title>THE EDIT — Your intelligence, distilled.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <header class="masthead">
      <div class="brand-side">
        <a class="brand" href="#" id="homeLink" aria-label="Show overall briefing">THE <span>EDIT.</span></a>
        <div class="strapline">YOUR WORLD, <strong>EDITED.</strong></div>
      </div>
      <div class="issue-side"><span class="issue-label">THE DAILY INTELLIGENCE MAGAZINE</span><span id="today"></span></div>
    </header>
    <div class="burgundy-rule"></div>
    <nav class="desktop-nav" id="nav" aria-label="News sections"></nav>
    <div class="mobile-nav"><label for="categorySelect">SECTION</label><select id="categorySelect" aria-label="Choose news section"></select></div>
    <div class="controlbar">
      <span class="feed-status" id="status" role="status">Preparing today's edition…</span>
      <div class="controls">
        <label for="search" class="sr-only">Search headlines</label>
        <input id="search" type="search" autocomplete="off" placeholder="Search headlines">
        <button id="savedBtn" class="tool-btn" title="Show your saved stories" aria-pressed="false">♡ <span class="saved-label">Saved</span> <span id="savedCount">0</span></button>
        <button id="refreshBtn" class="tool-btn" title="Reload the latest published edition">↻ <span class="refresh-label">Refresh</span></button>
      </div>
    </div>
    <main class="main" id="content" aria-live="polite">
      <div class="empty-state"><h1>Preparing your edition</h1><p>The latest stories will appear here.</p></div>
    </main>
    <div class="bottomline"><span>THE ESSENTIALS. NOTHING MORE.</span><span>Publisher previews · Read full stories at source</span></div>
  </div>
  <script src="app.js" defer></script>
</body>
</html>
